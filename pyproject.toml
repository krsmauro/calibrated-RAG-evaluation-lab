[project]
name = "ragcalibrate"
version = "0.0.0"
description = "Open-source harness that measures whether a RAG change helped, with a judge calibrated against blind human labels and a CI gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# 3.12, not newer: it has asyncio.TaskGroup and asyncio.timeout, and it is the version that the
# dependencies (onnxruntime, tokenizers, psycopg, pgvector) are certain to ship wheels for.
# Raise it deliberately, in one commit, once those are installed and tested.
requires-python = ">=3.12,<3.13"
# Each dependency is added by the step whose code imports it (none ahead of need).
# psycopg is the driver SQLAlchemy loads for Alembic; ingest and the service use it directly.
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ragcalibrate = "ragcalibrate.harness.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.13",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# This ruff also formats Markdown code blocks; the snippets in the docs and the skill are
# illustrative, not code to be checked, and reflowing them would rewrite the documentation.
exclude = ["*.md"]

[tool.ruff.lint]
# E,F: pycodestyle and pyflakes. I: import order. B: bugbear. UP: modern syntax. ASYNC: blocking
# calls in async code. S: bandit-style security checks. T20: no print (use logging). RUF: ruff-specific.
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest idiom: plain assert is the test mechanism.
"tests/**" = ["S101"]
# Command-line scripts print their report on purpose; src/ stays print-free.
"scripts/**" = ["T20"]

[tool.pyright]
include = ["src", "tests"]
# Strict on the code that produces numbers; tests only need to be consistent.
strict = ["src"]
pythonVersion = "3.12"

[tool.importlinter]
root_package = "ragcalibrate"

# The harness reaches the system under test only over HTTP; the one thing they share is the
# wire models in ragcalibrate.contract (Design §9, skill EVAL-CRITICAL-1).
[[tool.importlinter.contracts]]
name = "harness and service never import each other"
type = "independence"
modules = ["ragcalibrate.harness", "ragcalibrate.service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
