# Hooks call the tools through `uv run` on purpose: the versions in uv.lock are the only pins,
# so the hooks, CI and a developer's shell cannot disagree about the ruff or pyright version.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Needs the gitleaks binary on PATH (brew install gitleaks). CI scans the full history too.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
